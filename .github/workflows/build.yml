name: Build

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    branches:
        - '**'
  push:
    branches:
        - '**'

jobs:
  native-build:
    name: 'Native build'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@main
      with:
        submodules: true
    - name: Checkout submodules
      run: |
        git -C submodules/nz submodule update --init --depth=1
    - name: Install CMake
      run: |
        declare -r CMAKE_TAG='nightly'
        declare -r CMAKE_TARBALL='/var/tmp/toolchain.tar.xz'
        declare -r CMAKE_URL="https://github.com/AmanoTeam/cmake-builds/releases/download/${CMAKE_TAG}/x86_64-unknown-linux-gnu.tar.xz"
        
        curl --connect-timeout '10' --retry '15' --retry-all-errors --fail --silent --location --url "${CMAKE_URL}" --output "${CMAKE_TARBALL}"
        tar --directory="$(dirname "${CMAKE_TARBALL}")" --extract --file="${CMAKE_TARBALL}"
        
        export CMAKE_HOME='/var/tmp/cmake'
        export PATH="${CMAKE_HOME}/bin:${PATH}"
        
        echo "PATH=${PATH}" >> "${GITHUB_ENV}"
    - name: Check for cache
      id: check-cache
      uses: actions/cache@main
      with:
        key: gcc-16
        lookup-only: true
        path: |
          /var/tmp/x86_64-linux-gnu.tar.xz
          /var/tmp/x86_64-linux-gnu.tar.xz.sha256
    - name: Build MingW
      if: ${{ steps.check-cache.outputs.cache-hit != 'true' }}
      run: |
        bash './build.sh' 'native'
    - name: Create logs
      if: always()
      run: |
        declare logs=''
        
        while read file; do
            logs+="${file} "
        done <<< $(find "/var/tmp/"*"/build" -wholename '*.log' -o -wholename '*.yaml' -o -wholename '*Makefile')
        
        tar --create --file=- ${logs} | xz --threads='0' --compress -9 > '/var/tmp/logs.tar.xz'
    - name: Upload logs
      if:  always()
      uses: actions/upload-artifact@main
      with:
        name: logs
        if-no-files-found: error
        path: |
            /var/tmp/logs.tar.xz
    - name: Generate tarball
      if: ${{ steps.check-cache.outputs.cache-hit != 'true' }}
      run: |
        declare tarball_filename='/var/tmp/x86_64-linux-gnu.tar.xz'
        tar --directory='/var/tmp' --create --file=- 'mingw-gcc-cross' | xz --threads='0' --compress -9 > "${tarball_filename}"
        sha256sum "${tarball_filename}" | sed 's|/var/tmp/||' > "${tarball_filename}.sha256"
    - name: Upload artifact
      if: ${{ steps.check-cache.outputs.cache-hit != 'true' }}
      uses: actions/upload-artifact@main
      with:
        name: native-toolchain
        if-no-files-found: error
        path: |
          /var/tmp/x86_64-linux-gnu.tar.xz
          /var/tmp/x86_64-linux-gnu.tar.xz.sha256
    - name: Cache artifact
      if: ${{ steps.check-cache.outputs.cache-hit != 'true' }}
      uses: actions/cache@main
      with:
        key: gcc-16
        path: |
          /var/tmp/x86_64-linux-gnu.tar.xz
          /var/tmp/x86_64-linux-gnu.tar.xz.sha256

  release:
    needs: native-build
    runs-on: ubuntu-latest
    name: Create release
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@main
      - name: Create release
        uses: softprops/action-gh-release@master
        with:
          tag_name: gcc-16
          name: GCC 16
          files: ./*/*-unknown-*.tar.xz*
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          body: "* Update to GCC 16"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
